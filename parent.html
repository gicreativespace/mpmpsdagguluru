<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1B5E20" />
  <title>Parent — MPMP School - Dagguluru</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-parent">

  <!-- ===== SPLASH SCREEN ===== -->
  <div id="splash" class="splash-screen">
    <div class="splash-logo" style="font-size:4rem;">👨‍👩‍👧</div>
    <h1 class="splash-title">Parent</h1>
    <p class="splash-sub">MPMP School - Dagguluru</p>
    <div class="splash-loader"></div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <main id="parentApp" class="hm-app hidden">

    <!-- Header -->
    <header class="app-header">
      <button id="backBtn" class="icon-btn back-btn hidden" aria-label="Back" title="వెనక్కి">
        <i class="fas fa-arrow-left"></i>
      </button>
      <h1 id="pageTitle" class="app-title">Parent</h1>
      <button id="logoutBtn" class="icon-btn logout-btn hidden" aria-label="Logout" title="లాగౌట్">
        <i class="fas fa-sign-out-alt"></i>
      </button>
      <button id="themeBtn" class="icon-btn theme-btn" aria-label="Theme" title="థీమ్">🌙</button>
    </header>

    <!-- ========== SCREEN 1: LOGIN ========== -->
    <section id="screenLogin" class="screen hidden">
      <div class="card card-center">
        <div class="login-icon">👨‍👩‍👧</div>
        <h2 class="card-title">Parent Login</h2>
        <p class="card-desc">మీ పిల్లల Roll Number మరియు పుట్టిన తేదీ నమోదు చేయండి</p>

        <form id="parentLoginForm" class="form" novalidate>
          <div class="field">
            <label for="parentRollNumber">Student Roll Number</label>
            <input type="text" id="parentRollNumber" maxlength="10" inputmode="numeric" required autocomplete="off" placeholder="ఉదా: 01" />
          </div>
          <div class="field">
            <label for="parentDob">Student పుట్టిన తేదీ (ddmmyy)</label>
            <input type="text" id="parentDob" maxlength="6" inputmode="numeric" required autocomplete="off" placeholder="ఉదా: 150190" />
          </div>

          <p id="parentLoginError" class="form-error hidden" role="alert"></p>

          <button type="submit" id="parentLoginBtn" class="btn btn-primary btn-block">
            లాగిన్
          </button>
        </form>
      </div>
    </section>

    <!-- ========== SCREEN 2: DASHBOARD ========== -->
    <section id="screenDashboard" class="screen hidden">
      <!-- Welcome -->
      <div class="card" style="background: linear-gradient(135deg, #1565C0, #42A5F5); color: #fff; border: none;">
        <h2 style="font-size: 1.3rem; margin-bottom: 4px;">👋 స్వాగతం!</h2>
        <p id="parentWelcomeName" style="font-size: 1.1rem; font-weight: 600;">—</p>
        <p id="parentWelcomeClass" style="font-size: 0.85rem; opacity: 0.9;">—</p>
      </div>

      <!-- Quick Tabs -->
      <div class="card" style="padding: var(--space-sm);">
        <div style="display: flex; gap: var(--space-xs); overflow-x: auto;">
          <button id="tabNotices" class="btn btn-primary" onclick="switchTab('notices')" style="flex: 1; padding: 10px; font-size: 0.8rem; white-space: nowrap;">
            📢 Notices
          </button>
          <button id="tabDiary" class="btn btn-outline" onclick="switchTab('diary')" style="flex: 1; padding: 10px; font-size: 0.8rem; white-space: nowrap;">
            📖 Diary
          </button>
          <button id="tabAttendance" class="btn btn-outline" onclick="switchTab('attendance')" style="flex: 1; padding: 10px; font-size: 0.8rem; white-space: nowrap;">
            ✅ Attendance
          </button>
        </div>
      </div>

      <!-- Content Area -->
      <div id="parentContent">
        <p style="color: var(--text-muted); text-align: center; padding: var(--space-md);">లోడ్ అవుతోంది...</p>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="app-footer">
      An initiative of <span class="valiass-link" onclick="UI.showContact()">@valiass</span> team
    </footer>

  </main>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- ==================== FIREBASE SDKs ==================== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- ==================== APP SCRIPTS ==================== -->
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/parent.js"></script>
</body>
</html>
