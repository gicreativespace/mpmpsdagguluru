<!-- SCREEN 2: ADD CHILD -->
<section id="screenAddChild" class="screen hidden">
  <div class="card">
    <h2 class="card-title">👶 మీ పిల్లలను యాడ్ చేయండి</h2>
    <p class="card-desc">Class + Roll Number ఎంచుకోండి, DOB verify చేయండి</p>

    <form id="addChildForm" class="form" novalidate>
      <div class="field">
        <label for="addChildClass">Class</label>
        <select id="addChildClass" required>
          <option value="">-- Class ఎంచుకోండి --</option>
        </select>
      </div>
      <div class="field">
        <label for="addChildRoll">Roll Number</label>
        <input type="text" id="addChildRoll" inputmode="numeric" maxlength="10" required placeholder="ఉదా: 01" />
      </div>
      <div class="field">
        <label for="addChildDob">DOB Verify (ddmmyy)</label>
        <input type="text" id="addChildDob" inputmode="numeric" maxlength="6" required placeholder="ఉదా: 150190" />
      </div>
      <p id="addChildError" class="form-error hidden" role="alert"></p>
      <button type="submit" id="addChildBtn" class="btn btn-primary btn-block">
        ✅ Child Confirm చేయండి
      </button>
    </form>

    <button type="button" id="skipAddChild" class="link-btn" onclick="showScreen('childSelect')">
      Skip → My Children చూడండి
    </button>
  </div>
</section>

<!-- SCREEN 3: CHILD SELECT -->
<section id="screenChildSelect" class="screen hidden">
  <div class="card">
    <h2 class="card-title">👨‍👩‍👧‍👦 నా పిల్లలు</h2>
    <p class="card-desc">ఏ పిల్లవాడి వివరాలు చూడాలి?</p>
    <div id="childrenList" style="display: flex; flex-direction: column; gap: var(--space-md); margin-top: var(--space-md);">
      <!-- JS render -->
    </div>
    <button type="button" class="btn btn-secondary btn-block" onclick="showScreen('addChild')" style="margin-top: var(--space-md);">
      <i class="fas fa-plus-circle"></i> + Add Another Child
    </button>
  </div>
</section>
