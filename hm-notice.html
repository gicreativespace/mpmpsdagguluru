<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1B5E20" />
  <title>Notice Board — MPMP School - Dagguluru</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=27" />
</head>
<body class="page-notice">

  <div id="splash" class="splash-screen">
    <div class="splash-logo" style="font-size:4rem;">📢</div>
    <h1 class="splash-title">Notice Board</h1>
    <p class="splash-sub">MPMP School - Dagguluru</p>
    <div class="splash-loader"></div>
  </div>

  <main id="noticeApp" class="hm-app hidden">
    <header class="app-header">
      <h1 id="pageTitle" class="app-title">Notice Board</h1>
      <button id="homeBtn" class="icon-btn hidden" onclick="window.location.href='hm-dashboard.html'" aria-label="Home" title="Dashboard">
        <i class="fas fa-home"></i>
      </button>
      <button id="logoutBtn" class="icon-btn logout-btn" aria-label="Logout" title="లాగౌట్">
        <i class="fas fa-sign-out-alt"></i>
      </button>
      <button id="themeBtn" class="icon-btn theme-btn" aria-label="Theme" title="థీమ్">🌙</button>
    </header>

    <!-- SCREEN 1: LIST (with 2 tabs) -->
    <section id="screenList" class="screen hidden">
      <!-- Tabs -->
      <div class="card" style="padding: var(--space-sm);">
        <div style="display: flex; gap: var(--space-xs);">
          <button id="tabNotices" class="btn btn-primary" onclick="switchNoticeTab('notices')" style="flex: 1; padding: 10px; font-size: 0.85rem;">
            📢 Notices
          </button>
          <button id="tabPending" class="btn btn-outline" onclick="switchNoticeTab('pending')" style="flex: 1; padding: 10px; font-size: 0.85rem;">
            ⏳ Pending <span id="pendingBadge" style="display:none; background: var(--danger); color: #fff; border-radius: 50%; padding: 1px 6px; font-size: 0.65rem; margin-left: 4px;">0</span>
          </button>
        </div>
      </div>

      <!-- Notices Tab Content -->
      <div id="noticesTabContent">
        <div class="card">
          <h2 class="card-title">📢 Notice Board</h2>
          <p class="card-desc">పాఠశాల నోటీసులు</p>
          <button class="btn btn-primary btn-block" onclick="showAddScreen()" style="margin-bottom: var(--space-lg);">
            <i class="fas fa-plus" style="margin-right: 6px;"></i> కొత్త నోటీస్ యాడ్ చేయండి
          </button>
          <div id="noticesList">
            <p style="color: var(--text-muted); text-align: center; padding: var(--space-md);">లోడ్ అవుతోంది...</p>
          </div>
        </div>
      </div>

      <!-- Pending Tab Content -->
      <div id="pendingTabContent" style="display: none;">
        <div class="card">
          <h2 class="card-title">⏳ Teacher Announcements</h2>
          <p class="card-desc">Approve చేస్తే Notice Board లో కనిపిస్తాయి</p>
          <div id="pendingAnnouncementsList">
            <p style="color: var(--text-muted); text-align: center; padding: var(--space-md);">లోడ్ అవుతోంది...</p>
          </div>
        </div>
      </div>
    </section>

    <!-- SCREEN 2: FORM -->
    <section id="screenForm" class="screen hidden">
      <div class="card">
        <h2 class="card-title" id="formTitle">➕ కొత్త నోటీస్</h2>
        <p class="card-desc" id="formDesc">నోటీస్ వివరాలు నింపండి</p>
        <form id="noticeForm" class="form" novalidate>
          <div class="field">
            <label for="noticeTitle">శీర్షిక</label>
            <input type="text" id="noticeTitle" required autocomplete="off" placeholder="ఉదా: సెలవు ప్రకటన" />
          </div>
          <div class="field">
            <label for="noticeContent">వివరాలు</label>
            <textarea id="noticeContent" required rows="5" placeholder="నోటీస్ వివరాలు రాయండి..." style="height: auto; min-height: 120px; padding: 12px 16px; resize: vertical;"></textarea>
          </div>
          <div class="field">
            <label for="noticeCategory">వర్గం</label>
            <select id="noticeCategory" required style="height: 50px; padding: 10px 16px;">
              <option value="general">📌 General (సాధారణం)</option>
              <option value="exam">📝 Exam (పరీక్ష)</option>
              <option value="holiday">🎉 Holiday (సెలవు)</option>
              <option value="meeting">👥 Meeting (సమావేశం)</option>
              <option value="emergency">⚠️ Emergency (అత్యవసరం)</option>
            </select>
          </div>
          <div class="field">
            <label for="noticePriority">ప్రాధాన్యత</label>
            <select id="noticePriority" style="height: 50px; padding: 10px 16px;">
              <option value="normal">🟢 Normal</option>
              <option value="important">🟡 Important</option>
              <option value="urgent">🔴 Urgent</option>
            </select>
          </div>
          <p id="noticeError" class="form-error hidden" role="alert"></p>
          <button type="submit" id="noticeSubmitBtn" class="btn btn-primary btn-block">
            <i class="fas fa-save" style="margin-right: 8px;"></i> Save Notice
          </button>
        </form>
        <button type="button" class="link-btn" onclick="showScreen('list')">
          <i class="fas fa-arrow-left"></i> వెనక్కి
        </button>
      </div>
    </section>

    <footer class="app-footer">
      An initiative of <span class="valiass-link" onclick="UI.showContact()">@valiass</span> team
    </footer>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/hm-notice.js?v=27"></script>
</body>
</html>
