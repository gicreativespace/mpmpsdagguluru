<!-- ========== SCREEN 1: SETUP ========== -->
<section id="screenSetup" class="screen hidden">
  <div class="card">
    <h2 class="card-title">🏫 పాఠశాల సెటప్</h2>
    <p class="card-desc">మొదటిసారి మాత్రమే. అన్ని వివరాలు ఖచ్చితంగా నింపండి.</p>

    <form id="setupForm" class="form" novalidate>
      <!-- ✅ District — Auto-fill Dropdown (AP Districts) -->
      <div class="field">
        <label for="setupDistrict">జిల్లా</label>
        <select id="setupDistrict" required>
          <option value="">-- జిల్లా ఎంచుకోండి --</option>
          <option value="Alluri Sitharama Raju">Alluri Sitharama Raju</option>
          <option value="Anakapalli">Anakapalli</option>
          <option value="Anantapur">Anantapur</option>
          <option value="Annamayya">Annamayya</option>
          <option value="Bapatla">Bapatla</option>
          <option value="Chittoor">Chittoor</option>
          <option value="Dr. B.R. Ambedkar Konaseema">Dr. B.R. Ambedkar Konaseema</option>
          <option value="East Godavari">East Godavari</option>
          <option value="Eluru">Eluru</option>
          <option value="Guntur">Guntur</option>
          <option value="Kakinada">Kakinada</option>
          <option value="Krishna">Krishna</option>
          <option value="Kurnool">Kurnool</option>
          <option value="Nandyal">Nandyal</option>
          <option value="NTR">NTR</option>
          <option value="Palnadu">Palnadu</option>
          <option value="Parvathipuram Manyam">Parvathipuram Manyam</option>
          <option value="Prakasam">Prakasam</option>
          <option value="Sri Potti Sriramulu Nellore">Sri Potti Sriramulu Nellore</option>
          <option value="Sri Sathya Sai">Sri Sathya Sai</option>
          <option value="Srikakulam">Srikakulam</option>
          <option value="Tirupati">Tirupati</option>
          <option value="Visakhapatnam">Visakhapatnam</option>
          <option value="Vizianagaram">Vizianagaram</option>
          <option value="West Godavari">West Godavari</option>
          <option value="YSR Kadapa">YSR Kadapa</option>
        </select>
      </div>

      <div class="field">
        <label for="setupMandal">మండలం</label>
        <input type="text" id="setupMandal" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="setupVillage">గ్రామం</label>
        <input type="text" id="setupVillage" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="setupSchool">పాఠశాల పేరు</label>
        <input type="text" id="setupSchool" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="setupHmName">హెడ్‌మాస్టర్ పేరు</label>
        <input type="text" id="setupHmName" required autocomplete="off" />
      </div>

      <!-- ✅ Valiass Setup Code — hint తీసేయబడింది -->
      <div class="field">
        <label for="setupValiassCode">Valiass Setup Code</label>
        <input type="password" id="setupValiassCode" required autocomplete="off" inputmode="text" placeholder="Setup Code నమోదు చేయండి" />
        <!-- ❌ hint తీసేయబడింది: "5 ఫీల్డ్స్ చివరి అక్షరం + @533340" -->
      </div>

      <div class="field">
        <label for="setupHmPin">HM PIN (6 అంకెలు)</label>
        <div class="pin-wrap">
          <input type="password" id="setupHmPin" maxlength="6" inputmode="numeric" placeholder="6 అంకెల PIN నమోదు చేయండి" required autocomplete="new-password" />
          <button type="button" class="pin-toggle" data-target="setupHmPin" aria-label="Show PIN">👁</button>
        </div>
        <div id="setupPinDots" class="pin-dots" aria-hidden="true"></div>
      </div>

      <div class="field">
        <label for="setupHmPinConfirm">HM PIN నిర్ధారించండి</label>
        <div class="pin-wrap">
          <input type="password" id="setupHmPinConfirm" maxlength="6" inputmode="numeric" placeholder="మళ్లీ 6 అంకెల PIN నమోదు చేయండి" required autocomplete="new-password" />
          <button type="button" class="pin-toggle" data-target="setupHmPinConfirm" aria-label="Show PIN">👁</button>
        </div>
      </div>

      <p id="setupError" class="form-error hidden" role="alert"></p>

      <button type="submit" id="setupSubmitBtn" class="btn btn-primary btn-block">
        సెటప్ పూర్తి చేయండి
      </button>
    </form>
  </div>
</section>
